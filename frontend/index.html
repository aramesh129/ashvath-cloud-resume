<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ashvath Ramesh — Cloud Engineer</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <canvas id="matrix-bg"></canvas>

  <nav class="foreground">
    <div class="nav-logo">AR // SYS</div>
    <div class="nav-links">
      <a href="#about">ABOUT</a>
      <a href="#projects">WORK</a>
      <a href="#contact">CONTACT</a>
    </div>
  </nav>

  <main class="foreground">
    <section class="hero">
      <div class="hero-wrapper">
        <p class="eyebrow gsap-reveal">104840775962 // ROOT</p>
        <h1 class="gsap-reveal">ASHVATH</h1>
        <h1 class="gsap-reveal indent">RAMESH</h1>
        <p class="subtitle gsap-reveal">CREATIVE CLOUD ENGINEER & DEVELOPER</p>
      </div>
    </section>

    <section id="about" class="content-section">
      <h2 class="gsap-reveal">ABOUT</h2>
      <p class="gsap-reveal">Building scalable architecture and full-stack solutions. Bridging the gap between raw infrastructure and seamless user experiences.</p>
    </section>
    <section class="spacer"></section>
  </main>

  <div id="control-panel" class="foreground panel-reveal">
    <div class="panel-header">SYS_CONFIG</div>
    <div class="control-group">
      <label for="speed-slider">SPEED: <span id="speed-val">0.1</span></label>
      <input type="range" id="speed-slider" min="0.1" max="3.0" step="0.1" value="0.1">
    </div>
    <div class="control-group">
      <label for="density-slider">FONT_SIZE: <span id="density-val">10</span></label>
      <input type="range" id="density-slider" min="5" max="40" step="1" value="10">
    </div>
    <div class="control-group">
      <label for="color-picker">THEME_HEX:</label>
      <input type="color" id="color-picker" value="#00ffcc">
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/studio-freight/lenis@1.0.19/bundled/lenis.min.js"></script>
  <script src="script.js"></script>
